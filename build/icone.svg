<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Ícone do Teleprompter (um produto Chiaro Filmes). Fonte única de todos os tamanhos:
    `npm run icons` gera os PNG, o .ico e o .icns a partir deste arquivo
    (e de icone-16.svg, a variante simplificada para 16 e 32 px).
    Quadrado de cantos arredondados com o gradiente Chiaro (Lavanda, Violeta, Ametista);
    por cima, o vidro inclinado do teleprompter em traço Areia, com três linhas de texto.
    A linha do meio está sobre a faixa Pêssego: a faixa de referência de leitura.
  -->
  <defs>
    <linearGradient id="chiaro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8C4EDB"/>
      <stop offset="0.5" stop-color="#672FA2"/>
      <stop offset="1" stop-color="#2E1F5B"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#chiaro)"/>
  <g transform="translate(512 512) skewX(-9) translate(-512 -512)">
    <rect x="252" y="224" width="520" height="576" rx="64" fill="#F7E1C4" fill-opacity="0.1"
          stroke="#F7E1C4" stroke-width="40" stroke-linejoin="round"/>
    <rect x="292" y="448" width="440" height="128" rx="36" fill="#FACE95"/>
    <rect x="344" y="326" width="336" height="48" rx="24" fill="#F7E1C4"/>
    <rect x="344" y="488" width="336" height="48" rx="24" fill="#070010"/>
    <rect x="344" y="650" width="232" height="48" rx="24" fill="#F7E1C4"/>
  </g>
</svg>
